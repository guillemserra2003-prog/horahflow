<style>
:root{
  --ink:#16151F; --ink-2:#3D3A4F; --muted:#6B6880; --faint:#9A97AB;
  --line:#ECEBF1; --line-2:#E0DEE8; --bg:#FFFFFF; --soft:#F7F7FA; --soft-2:#F1F0F5;
  --g1:#4A6B60; --g2:#5CC57A; --green:#2F8F5B; --green-soft:#EAF7EE;
  --red:#C2412D; --red-soft:#FCEDEA; --amber:#B7791F; --amber-soft:#FBF3E2;
  --grad:linear-gradient(90deg,var(--g1),var(--g2));
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(22,21,31,.04),0 8px 24px rgba(22,21,31,.06);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#2a2838}
.btn-green{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(92,197,122,.28)}
.btn-green:hover{box-shadow:0 8px 24px rgba(92,197,122,.38)}
.btn-ghost{border:1px solid var(--line-2);background:#fff}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{height:36px;padding:0 14px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{font-weight:700;border-bottom:2px solid var(--g2)}

/* Nav */
.nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{display:flex;align-items:center;height:72px;gap:32px}
.nav .logo img{height:30px;width:auto}
.nav .links{display:flex;gap:28px;font-weight:600;font-size:15px;color:var(--ink-2)}
.nav .links a:hover{color:var(--ink)}
.nav .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.nav .burger{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);align-items:center;justify-content:center}

/* Hero */
.hero{padding:72px 0 40px;position:relative;overflow:hidden}
.hero .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--green);background:var(--green-soft);padding:6px 12px;border-radius:999px;letter-spacing:.01em}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--g2)}
h1.display{font-size:clamp(40px,5.4vw,64px);line-height:1.04;letter-spacing:-.035em;font-weight:800;margin:20px 0 20px}
h1.display em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:19px;color:var(--muted);max-width:540px}
.hero .ctas{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.hero .proof{display:flex;gap:22px;margin-top:28px;color:var(--muted);font-size:14px;font-weight:600;flex-wrap:wrap}
.hero .proof span{display:flex;align-items:center;gap:6px}
.hero .proof svg{color:var(--green)}

.mock{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px rgba(22,21,31,.10);padding:22px;position:relative}
.mock .bar{display:flex;gap:6px;margin-bottom:16px}
.mock .bar i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.mock .float{position:absolute;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.mock .float.a{left:-36px;bottom:-22px}
.mock .float.b{right:-20px;top:-18px}
.dot{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.dot.red{background:var(--red-soft);color:var(--red)}
.dot.green{background:var(--green-soft);color:var(--green)}
.dot.amber{background:var(--amber-soft);color:var(--amber)}
.dot.gray{background:var(--soft-2);color:var(--ink-2)}

/* Sections */
section.block{padding:96px 0}
section.alt{background:var(--soft)}
.sec-head{max-width:680px;margin-bottom:48px}
.sec-head.center{text-align:center;margin-left:auto;margin-right:auto}
.kicker{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--green)}
h2.title{font-size:clamp(30px,3.6vw,44px);letter-spacing:-.03em;line-height:1.1;font-weight:800;margin:12px 0 14px}
.sub{color:var(--muted);font-size:18px}

.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;color:var(--muted);font-weight:600;font-size:14px}
.strip .wrap{display:flex;gap:36px;justify-content:center;flex-wrap:wrap;align-items:center}
.strip b{color:var(--ink)}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{border:1px solid var(--line);border-radius:var(--r);padding:28px;background:#fff}
.step .n{font-size:13px;font-weight:800;color:var(--faint);margin-bottom:28px}
.step h3{font-size:20px;letter-spacing:-.01em;margin-bottom:8px}
.step p{color:var(--muted)}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.feature{background:#fff;padding:30px}
.feature .dot{margin-bottom:18px;width:40px;height:40px}
.feature h3{font-size:18px;margin-bottom:6px}
.feature p{color:var(--muted);font-size:15px}

/* Demo */
.demo{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:stretch}
.inbox{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;display:flex;flex-direction:column}
.inbox-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:700}
.inbox-list{max-height:430px;overflow:auto}
.mail{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px;transition:background .3s}
.mail .av{width:32px;height:32px;border-radius:50%;background:var(--soft-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;color:var(--ink-2)}
.mail .meta{min-width:0;flex:1}
.mail .from{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.mail .from small{color:var(--faint);font-weight:600}
.mail .subj{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail.scan{background:#F4FBF6}
.mail.hit .av{background:var(--green-soft);color:var(--green)}
.mail.skip{opacity:.45}
.demo-out{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:24px;min-height:480px;position:relative}
.demo-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:14px;color:var(--muted)}
.progress{height:6px;border-radius:99px;background:var(--soft-2);overflow:hidden;width:260px}
.progress i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}

/* Pricing */
.toggle{display:inline-flex;background:var(--soft-2);border-radius:999px;padding:4px;margin-top:10px}
.toggle button{padding:8px 18px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
.plan{border:1px solid var(--line);border-radius:18px;padding:30px;background:#fff;display:flex;flex-direction:column}
.plan.pop{border:2px solid var(--ink);position:relative}
.plan.pop .tag{position:absolute;top:-13px;left:30px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.plan h3{font-size:18px}
.plan .desc{color:var(--muted);font-size:14px;min-height:42px;margin-top:4px}
.plan .price{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:20px 0 4px}
.plan .price small{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0}
.plan .per{font-size:13px;color:var(--faint);min-height:20px}
.plan ul{list-style:none;margin:22px 0 28px;display:grid;gap:10px;font-size:15px}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li svg{color:var(--green);flex:none;margin-top:3px}
.plan .btn{margin-top:auto}

/* FAQ */
.faq{max-width:760px;margin:0 auto}
.faq details{border-bottom:1px solid var(--line);padding:20px 0}
.faq summary{font-weight:700;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px}
.faq summary::after{content:'+';font-size:22px;color:var(--faint);line-height:1}
.faq details[open] summary::after{content:'–'}
.faq p{color:var(--muted);margin-top:10px}

.cta-band{background:var(--ink);color:#fff;border-radius:24px;padding:64px;display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap}
.cta-band h2{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.03em;line-height:1.1;max-width:560px}
.cta-band p{color:#B9B6C9;margin-top:10px}

footer.foot{padding:56px 0 40px;border-top:1px solid var(--line);margin-top:96px;color:var(--muted);font-size:14px}
footer.foot .wrap{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px}
footer.foot h4{color:var(--ink);font-size:14px;margin-bottom:12px}
footer.foot a{display:block;margin-bottom:8px}
footer.foot a:hover{color:var(--ink)}
footer.foot .legal{grid-column:1/-1;border-top:1px solid var(--line);padding-top:24px;margin-top:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

/* Blog */
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.post-card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.post-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.post-cover{height:170px;display:flex;align-items:flex-end;padding:20px;color:#fff;font-weight:800;font-size:44px;letter-spacing:-.03em}
.post-card .body{padding:22px;display:flex;flex-direction:column;gap:8px;flex:1}
.post-card .cat{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--green)}
.post-card h3{font-size:19px;line-height:1.3;letter-spacing:-.01em}
.post-card p{color:var(--muted);font-size:15px}
.post-card .date{margin-top:auto;font-size:13px;color:var(--faint);padding-top:10px}
.article{max-width:720px;margin:0 auto;padding:56px 24px 0}
.article .back{font-weight:700;color:var(--muted);font-size:14px}
.article h1{font-size:clamp(32px,4.4vw,48px);letter-spacing:-.03em;line-height:1.1;margin:18px 0 14px}
.article .meta{color:var(--faint);font-size:14px;margin-bottom:36px}
.article .content p{font-size:18px;line-height:1.75;margin-bottom:22px;color:#2A2836}
.article .content h2{font-size:24px;letter-spacing:-.02em;margin:40px 0 14px}
.article .content ul{margin:0 0 22px 22px;font-size:18px;line-height:1.75;color:#2A2836}
.article .content blockquote{border-left:3px solid var(--g2);padding:6px 0 6px 20px;margin:28px 0;font-size:20px;font-weight:700;letter-spacing:-.01em}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .side{background:var(--soft);padding:48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.auth .side blockquote{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.2;max-width:440px}
.auth .form-wrap{display:flex;align-items:center;justify-content:center;padding:48px 24px}
.auth form{width:100%;max-width:380px}
.auth h1{font-size:30px;letter-spacing:-.03em;margin-bottom:6px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-size:14px;font-weight:700}
.input{height:46px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 14px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,21,31,.06)}
textarea.input{height:auto;min-height:150px;padding:12px 14px;resize:vertical;font-size:14px;line-height:1.5}
.err{color:var(--red);font-size:14px;font-weight:600;min-height:20px;margin-bottom:8px}
.hint{color:var(--faint);font-size:13px}
.divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:13px;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}

/* App */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:var(--soft)}
.side-nav{background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-nav .logo{padding:2px 10px 24px}
.side-nav .logo img{height:26px;width:auto}
.side-nav nav{display:grid;gap:2px}
.side-nav nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.side-nav nav a:hover{background:var(--soft);color:var(--ink)}
.side-nav nav a.on{background:var(--soft-2);color:var(--ink)}
.side-nav nav a .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.side-nav .bottom{margin-top:auto;display:grid;gap:12px}
.plan-box{border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px}
.plan-box b{font-size:14px}
.me{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.me .who{min-width:0;font-size:13px;line-height:1.3}
.me .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.main{padding:28px 36px 60px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.topbar h1{font-size:28px;letter-spacing:-.03em}
.topbar .sub{font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.chip.green{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip.red{background:var(--red-soft);border-color:transparent;color:var(--red)}
.chip.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card h3{font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card h3 small{color:var(--faint);font-weight:600;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi .l{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.kpi .s{font-size:13px;color:var(--faint);margin-top:2px}
.kpi.hl{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpi.hl .l,.kpi.hl .s{color:#B9B6C9}
.kpi.hl .v{color:#7FE09A}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

.score{display:flex;gap:20px;align-items:center}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1}
.ring .val small{font-size:12px;color:var(--faint);font-weight:700;letter-spacing:0;margin-top:4px}

.bars{display:grid;gap:12px}
.barrow{display:grid;grid-template-columns:150px 1fr 80px;gap:12px;align-items:center;font-size:14px}
.barrow .name{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .name i{width:9px;height:9px;border-radius:3px;flex:none}
.barrow .track{height:10px;background:var(--soft-2);border-radius:99px;overflow:hidden}
.barrow .track b{display:block;height:100%;border-radius:99px}
.barrow .amt{text-align:right;font-weight:700}

.trend{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.trend .stack{width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:8px 8px 4px 4px;overflow:hidden;position:relative}
.trend .stack .r{background:var(--ink-2)}
.trend .stack .o{background:#8FD6A3}
.trend .col.partial .stack{opacity:.55}
.trend .lab{font-size:12px;color:var(--faint);font-weight:700;text-transform:capitalize}
.trend .tt{font-size:11px;font-weight:800;color:var(--ink-2)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}

.leak{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.leak:last-child{border-bottom:0;padding-bottom:0}
.leak:first-child{padding-top:0}
.leak .txt{flex:1;min-width:0}
.leak .txt b{display:block;font-size:15px}
.leak .txt p{font-size:14px;color:var(--muted)}
.leak .save{font-weight:800;color:var(--green);white-space:nowrap;font-size:14px}

.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:800;padding:0 12px 12px;border-bottom:1px solid var(--line)}
.table td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tr.clickable{cursor:pointer}
.table tr.clickable:hover td{background:var(--soft)}
.svc{display:flex;align-items:center;gap:12px;font-weight:700}
.logo-sq{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;flex:none}
.svc small{display:block;font-weight:600;color:var(--faint);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:#fff}
.seg button{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.right{text-align:right}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools .input{height:38px;width:auto;min-width:220px;font-size:14px}
.tools select.input{min-width:0}

.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .h{background:#fff;padding:10px;font-size:12px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.cal .d{background:#fff;min-height:104px;padding:8px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.cal .d.out{background:var(--soft)}
.cal .d.out .dn{color:var(--line-2)}
.cal .d.today .dn{background:var(--ink);color:#fff;border-radius:99px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal .dn{font-weight:700;color:var(--muted);font-size:13px}
.cal .ev{background:var(--soft-2);border-radius:6px;padding:3px 6px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.cal .ev.big{background:var(--red-soft);color:var(--red)}
.cal .ev span{overflow:hidden;text-overflow:ellipsis}
.cal .tot{margin-top:auto;font-size:11px;color:var(--faint);font-weight:700}

.alt-card{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:#fff}
.alt-card .head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.alt-card .head .p{margin-left:auto;text-align:right;font-weight:800}
.alt-card .head .p small{display:block;color:var(--faint);font-weight:600;font-size:12px}
.alt{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
.alt b{display:block}
.alt p{color:var(--muted)}
.alt .free{margin-left:auto;font-size:12px;font-weight:800;color:var(--green);background:var(--green-soft);padding:3px 8px;border-radius:99px;white-space:nowrap}
.alts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.tip{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.tip:last-child{border:0}
.tip p{color:var(--muted);font-size:14px}

.source{display:flex;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.source:last-child{border:0}
.source .info{flex:1;min-width:0}
.source .info b{display:block}
.source .info span{font-size:14px;color:var(--muted)}
.connect-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.connect{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:22px;display:flex;flex-direction:column;gap:10px}
.connect h4{font-size:16px}
.connect p{font-size:14px;color:var(--muted);flex:1}
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);font-size:14px;transition:border-color .2s,background .2s;cursor:pointer}
.drop.over{border-color:var(--g2);background:var(--green-soft)}

.empty{text-align:center;padding:64px 24px;max-width:520px;margin:0 auto}
.empty h2{font-size:26px;letter-spacing:-.02em;margin:18px 0 8px}
.empty p{color:var(--muted);margin-bottom:24px}

.ask{display:flex;gap:10px}
.ask .input{flex:1}
.chat{display:grid;gap:10px;margin-top:14px;max-height:280px;overflow:auto}
.msg{padding:10px 14px;border-radius:14px;font-size:14px;max-width:88%}
.msg.u{background:var(--ink);color:#fff;justify-self:end;border-bottom-right-radius:4px}
.msg.a{background:var(--soft-2);justify-self:start;border-bottom-left-radius:4px}
.suggest{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.suggest button{font-size:13px;font-weight:600;border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;background:#fff;color:var(--ink-2)}
.suggest button:hover{border-color:var(--ink)}

/* Modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(22,21,31,.4);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:20px;max-width:520px;width:100%;padding:28px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.2)}
.modal h2{font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
.modal .x{float:right;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal .x:hover{background:var(--soft)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;animation:up .2s;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.fade-in{animation:fadein .4s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.mobile-tabs{display:none}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-2b{grid-template-columns:1fr}
  .connect-grid{grid-template-columns:1fr}
}
@media (max-width:900px){
  .nav .links{display:none}
  .nav .right .btn-ghost{display:none}
  .nav .burger{display:flex}
  .nav.open .links{display:flex;position:absolute;top:72px;left:0;right:0;background:#fff;flex-direction:column;padding:16px 24px;border-bottom:1px solid var(--line);gap:16px}
  .hero .grid,.demo{grid-template-columns:1fr}
  .mock .float{display:none}
  .steps,.features,.plans,.blog-grid{grid-template-columns:1fr}
  footer.foot .wrap{grid-template-columns:1fr 1fr}
  .auth{grid-template-columns:1fr}
  .auth .side{display:none}
  .app{grid-template-columns:1fr}
  .side-nav{display:none}
  .main{padding:20px 16px 96px}
  .mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  .mobile-tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--faint);padding:4px 6px}
  .mobile-tabs a.on{color:var(--ink)}
  .cta-band{padding:36px}
  .alts-grid{grid-template-columns:1fr}
  .barrow{grid-template-columns:110px 1fr 70px}
  .table .hide-m{display:none}
  .cal .d{min-height:70px;padding:4px}
  .cal .ev span{display:none}
}

@media (min-width:901px){.hidden-d{display:none!important}}

  const FX = { EUR: 1, USD: 0.92, GBP: 1.17 };
  const CYCLE = {
    weekly:    { label: 'Semanal',    days: 7,   perMonth: 4.33 },
    monthly:   { label: 'Mensual',    days: 30,  perMonth: 1 },
    bimonthly: { label: 'Bimestral',  days: 61,  perMonth: 0.5 },
    quarterly: { label: 'Trimestral', days: 91,  perMonth: 1 / 3 },
    yearly:    { label: 'Anual',      days: 365, perMonth: 1 / 12 }
  };

  const RX_RECEIPT = /recibo|factura|receipt|invoice|tu pago|payment|pago (?:realizado|confirmado|recibido)|cargo|charged|hemos cobrado|pedido|order|renovaci[oó]n|renewal|renew|suscripci[oó]n|subscription|membres[ií]a|membership|cuota|importe|total pagado|billing|facturaci[oó]n|transacci[oó]n|compra|purchase|trip|viaje/i;
  const RX_RECUR = /suscripci[oó]n|subscription|renovaci[oó]n|renewal|renew|membres[ií]a|membership|mensual|monthly|anual|annual|yearly|cuota|tu plan|your plan|premium|plus\b|recurrente|recurring/i;
  const RX_TRIAL = /prueba gratuita|periodo de prueba|free trial|trial (?:ends|ended|period)|tu prueba|fin de la prueba/i;
  const RX_REFUND = /reembolso|refund|devoluci[oó]n|abono a tu cuenta/i;
  const RX_MARKETING = /hasta un \d+ ?%|ofertas? exclusiv|newsletter|black friday|date de baja|unsubscribe|no te lo pierdas/i;
  const RX_AMOUNT = /(?:(€|EUR|USD|US\$|\$|£|GBP)\s?(\d{1,3}(?:[.,\s]\d{3})*(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?))|(?:(\d{1,3}(?:[.,\s]\d{3})*[.,]\d{1,2}|\d+(?:[.,]\d{1,2})?)\s?(€|EUR|euros?|USD|\$|£|GBP))/gi;

  function parseNum(s) {
    s = String(s).replace(/\s/g, '');
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) {
      if (lc > ld) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (lc > -1) {
      s = (s.length - lc - 1 <= 2) ? s.replace(',', '.') : s.replace(/,/g, '');
    } else if (ld > -1) {
      if (s.length - ld - 1 === 3 && s.split('.').length > 1 && !/\.\d{1,2}$/.test(s)) s = s.replace(/\./g, '');
    }
    const n = parseFloat(s);
    return isFinite(n) ? n : NaN;
  }

  function normCur(c) {
    c = (c || '').toUpperCase();
    if (c === '€' || c.startsWith('EUR')) return 'EUR';
    if (c === '$' || c === 'US$' || c === 'USD') return 'USD';
    if (c === '£' || c === 'GBP') return 'GBP';
    return 'EUR';
  }

  function extractAmount(text) {
    const found = [];
    let m;
    RX_AMOUNT.lastIndex = 0;
    while ((m = RX_AMOUNT.exec(text))) {
      const cur = normCur(m[1] || m[4]);
      const val = parseNum(m[2] || m[3]);
      if (!isFinite(val) || val <= 0 || val > 20000) continue;
      const before = text.slice(Math.max(0, m.index - 28), m.index).toLowerCase();
      let score = 0;
      if (/total|importe|amount|cargo|charged|cobrad|pagad|paid|precio|price|a pagar|you paid|has pagado/.test(before)) score += 3;
      if (/total/.test(before)) score += 2;
      if (/subtotal|iva|vat|tax|impuesto|descuento|discount|ahorra|env[ií]o|shipping|antes|was\b/.test(before.slice(-14))) score -= 3;
      found.push({ val, cur, score, eur: Math.round(val * (FX[cur] || 1) * 100) / 100 });
    }
    if (!found.length) return null;
    found.sort((a, b) => b.score - a.score || b.eur - a.eur);
    return found[0];
  }

  function senderName(from) {
    if (!from) return '';
    const m = from.match(/^\s*"?([^"<]+?)"?\s*</);
    if (m && m[1].trim() && !/@/.test(m[1])) return m[1].trim();
    const d = from.match(/@([\w.-]+)/);
    if (d) {
      const parts = d[1].split('.').filter(p => !/^(mail|email|e|info|news|noreply|no-reply|account|accounts|billing|em|send|mg|notifications?)$/i.test(p));
      const core = parts.length > 1 ? parts[parts.length - 2] : parts[0];
      return core ? core.charAt(0).toUpperCase() + core.slice(1) : '';
    }
    return from.trim();
  }

  function cleanMerchant(n) {
    return n.replace(/\b(no-?reply|noreply|equipo de|team|billing|facturaci[oó]n|recibos?|receipts?|pagos?|payments?)\b/gi, '').replace(/\s{2,}/g, ' ').trim() || n;
  }

  function identify(email) {
    const hay = `${email.from || ''} ${email.subject || ''}`;
    for (const c of CATALOG) if (c.re.test(hay)) return c;
    const body = (email.body || '').slice(0, 600);
    for (const c of CATALOG) if (c.rec && c.re.test(body)) return c;
    return null;
  }

  function guessCat(text) {
    const t = text.toLowerCase();
    if (/restaurante|pizza|burger|sushi|comida|food|delivery/.test(t)) return 'comida';
    if (/taxi|viaje|trip|ride|renfe|vueling|ryanair|iberia|gasolin|parking|aparcamiento/.test(t)) return 'transporte';
    if (/luz|electricidad|gas natural|agua|seguro|alquiler|comunidad/.test(t)) return 'hogar';
    if (/fibra|m[oó]vil|internet|telefon/.test(t)) return 'telecom';
    if (/software|app|licencia|license|saas|cloud|hosting|dominio|domain/.test(t)) return 'software';
    if (/curso|course|academy|formaci/.test(t)) return 'formacion';
    if (/pedido|order|compra|purchase|tienda|shop/.test(t)) return 'compras';
    return 'otros';
  }

  /** Convierte un correo en un cargo (o null si no es un gasto). */
  function toCharge(email) {
    const subject = email.subject || '';
    const body = (email.body || '').replace(/\s+/g, ' ');
    const text = `${subject} . ${body}`;
    if (RX_REFUND.test(subject)) return null;
    if (!RX_RECEIPT.test(text)) return null;
    if (RX_MARKETING.test(text) && !/recibo|factura|receipt|invoice|cargo|charged/i.test(text)) return null;
    const svc = identify(email);
    const date = new Date(email.date);
    if (isNaN(date)) return null;
    const merchant = svc && svc.id !== 'gym' ? svc.name : cleanMerchant(senderName(email.from)) || (svc && svc.name);
    // Inicio de prueba gratuita sin cargo: se registra como aviso, no como gasto
    if (RX_TRIAL.test(text) && /(?:hoy|today|ahora)[^.]{0,20}\b0[.,]00\b|\b0[.,]00\s?€/i.test(text)) {
      return { trialOnly: true, key: svc ? svc.id : merchant.toLowerCase().replace(/[^a-z0-9]+/g, '-'), merchant, date };
    }
    const amt = extractAmount(text);
    if (!amt) return null;
    const cat = svc ? svc.cat : guessCat(text);
    const recurringHint = (svc && svc.rec) || RX_RECUR.test(text);
    let cycleHint = null;
    if (/anual|annual|yearly|al año|per year|\/año|\/year/i.test(text)) cycleHint = 'yearly';
    else if (/semanal|weekly/i.test(text)) cycleHint = 'weekly';
    else if (/trimestral|quarterly/i.test(text)) cycleHint = 'quarterly';
    else if (/mensual|monthly|al mes|per month|\/mes|\/month/i.test(text)) cycleHint = 'monthly';
    return {
      id: email.id || (merchant + date.getTime()),
      merchant, key: (svc ? svc.id : merchant.toLowerCase().replace(/[^a-z0-9]+/g, '-')),
      svc: svc ? svc.id : null, cat, date, amount: amt.eur, original: amt.val, currency: amt.cur,
      recurringHint, cycleHint, trial: RX_TRIAL.test(text),
      subject, source: email.source || 'correo', account: email.account || ''
    };
  }

  function addCycle(d, cycle, n = 1) {
    const r = new Date(d);
    if (cycle === 'monthly') r.setMonth(r.getMonth() + n);
    else if (cycle === 'bimonthly') r.setMonth(r.getMonth() + 2 * n);
    else if (cycle === 'quarterly') r.setMonth(r.getMonth() + 3 * n);
    else if (cycle === 'yearly') r.setFullYear(r.getFullYear() + n);
    else r.setDate(r.getDate() + 7 * n);
    return r;
  }

  const DAY = 864e5;
  const median = a => { const s = [...a].sort((x, y) => x - y); const h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };

  function detectCycle(dates) {
    if (dates.length < 2) return null;
    const gaps = [];
    for (let i = 1; i < dates.length; i++) gaps.push((dates[i] - dates[i - 1]) / DAY);
    const g = median(gaps);
    if (g >= 5 && g <= 9) return 'weekly';
    if (g >= 25 && g <= 36) return 'monthly';
    if (g >= 54 && g <= 66) return 'bimonthly';
    if (g >= 84 && g <= 96) return 'quarterly';
    if (g >= 340 && g <= 390) return 'yearly';
    return null;
  }

  /** Análisis completo. prefs = { usage: {key: 'si'|'no'|'aveces'}, cancelled: {key:true} } */
  function analyze(emails, prefs = {}, now = new Date()) {
    const usage = prefs.usage || {}, cancelled = prefs.cancelled || {};
    // 1. Correos -> cargos (sin duplicar el mismo correo)
    const seen = new Set();
    const charges = [], trials = {};
    for (const e of emails) {
      const sig = (e.id || '') + '|' + (e.subject || '') + '|' + e.date;
      if (seen.has(sig)) continue; seen.add(sig);
      const c = toCharge(e);
      if (c && c.trialOnly) trials[c.key] = c.date;
      else if (c) charges.push(c);
    }
    charges.sort((a, b) => a.date - b.date);

    // 2. Agrupar por comercio
    const groups = {};
    for (const c of charges) (groups[c.key] = groups[c.key] || []).push(c);

    const subs = [], oneoffs = [], leaks = [];
    const svcById = Object.fromEntries(CATALOG.map(c => [c.id, c]));

    for (const key in groups) {
      if (prefs.ignored && prefs.ignored[key]) continue;
      const g = groups[key];
      const first = g[0], last = g[g.length - 1];
      const svc = first.svc ? svcById[first.svc] : null;
      // Eliminar cargos duplicados (mismo importe en <4 días) pero registrarlos como brecha
      const clean = [];
      for (const c of g) {
        const prev = clean[clean.length - 1];
        if (prev && Math.abs(c.date - prev.date) < 4 * DAY && Math.abs(c.amount - prev.amount) < 0.01 && (first.recurringHint)) {
          leaks.push({ type: 'duplicado', sev: 3, key, merchant: c.merchant,
            title: `Cobro duplicado en ${c.merchant}`,
            detail: `Se cobraron ${fmt(c.amount)} dos veces (${fmtDate(prev.date)} y ${fmtDate(c.date)}). Pide la devolución al servicio.`,
            saving: 0, oneTime: c.amount });
          continue;
        }
        clean.push(c);
      }
      const dates = clean.map(c => c.date);
      const amounts = clean.map(c => c.amount);
      let cycle = detectCycle(dates);
      const similar = amounts.length > 1 && (Math.max(...amounts) - Math.min(...amounts)) / Math.max(...amounts) < 0.2;
      const hinted = g.some(c => c.recurringHint);
      const isRec = (hinted && (svc ? svc.rec !== false : true)) || (cycle && similar && clean.length >= 3);
      if (!isRec) { oneoffs.push(...clean); continue; }
      if (!cycle) cycle = g.find(c => c.cycleHint)?.cycleHint || (svc && svc.cycle) || 'monthly';
      const lastC = clean[clean.length - 1];
      let next = addCycle(lastC.date, cycle);
      const overdue = (now - lastC.date) / DAY > CYCLE[cycle].days * 1.6;
      let k = 1; while (next < now && k < 60) { next = addCycle(lastC.date, cycle, ++k); }
      const prevC = clean.length > 1 ? clean[clean.length - 2] : null;
      // Facturas variables (luz, agua...): se usa la media y no se marca subida
      const variable = lastC.cat === 'hogar' || new Set(amounts.map(a => a.toFixed(2))).size >= 3;
      let priceUp = null;
      if (!variable && prevC) {
        let j = clean.length - 2;
        while (j >= 0 && Math.abs(clean[j].amount - lastC.amount) < 0.01) j--;
        if (j >= 0 && lastC.amount > clean[j].amount * 1.03 && (now - clean[j + 1].date) / DAY < 200)
          priceUp = { from: clean[j].amount, to: lastC.amount, date: clean[j + 1].date };
      }
      const trial = g.some(c => c.trial) || !!trials[key];
      const recent = clean.slice(-3).map(c => c.amount);
      const ref = variable ? recent.reduce((a, b) => a + b, 0) / recent.length : lastC.amount;
      const s = {
        key, merchant: lastC.merchant, svc: svc ? svc.id : null, cat: lastC.cat, cycle,
        amount: round2(ref), variable, currency: lastC.currency, original: lastC.original,
        monthly: Math.round(ref * CYCLE[cycle].perMonth * 100) / 100,
        first: clean[0].date, last: lastC.date, next, count: clean.length,
        totalPaid: Math.round(amounts.reduce((a, b) => a + b, 0) * 100) / 100,
        priceUp, trial, status: cancelled[key] ? 'cancelada' : (overdue ? 'inactiva' : 'activa'),
        usage: usage[key] || null, history: clean,
        cancel: svc ? svc.cancel : '', alts: svc ? svc.alts : [], account: lastC.account
      };
      subs.push(s);
    }

    const active = subs.filter(s => s.status === 'activa');
    const monthlyRec = round2(active.reduce((a, s) => a + s.monthly, 0));

    // 3. Brechas
    for (const s of active) {
      if (s.priceUp) leaks.push({ type: 'subida', sev: 2, key: s.key, merchant: s.merchant,
        title: `${s.merchant} ha subido de precio`,
        detail: `Pasó de ${fmt(s.priceUp.from)} a ${fmt(s.priceUp.to)} (+${Math.round((s.priceUp.to / s.priceUp.from - 1) * 100)} %) desde el ${fmtDate(s.priceUp.date)}. Revisa si te compensa o si hay un plan más barato.`,
        saving: round2((s.priceUp.to - s.priceUp.from) * CYCLE[s.cycle].perMonth) });
      if (s.trial) leaks.push({ type: 'prueba', sev: 2, key: s.key, merchant: s.merchant,
        title: `La prueba gratuita de ${s.merchant} ya se cobra`,
        detail: `Empezó como prueba y ahora pagas ${fmt(s.amount)} ${CYCLE[s.cycle].label.toLowerCase()}. ¿Lo decidiste tú o se te pasó?`,
        saving: s.monthly });
      if (s.usage === 'no') leaks.push({ type: 'sinuso', sev: 3, key: s.key, merchant: s.merchant,
        title: `Pagas ${s.merchant} y dices que no lo usas`,
        detail: `Cancelarlo te ahorra ${fmt(s.monthly * 12)} al año.`, saving: s.monthly });
      const days = (s.next - now) / DAY;
      if (s.cycle === 'yearly' && days <= 30) leaks.push({ type: 'renovacion', sev: 2, key: s.key, merchant: s.merchant,
        title: `${s.merchant} se renueva en ${Math.max(0, Math.ceil(days))} días`,
        detail: `Cargo anual de ${fmt(s.amount)} el ${fmtDate(s.next)}. Si no lo vas a usar, cancélalo antes.`, saving: 0, oneTime: s.amount });
    }
    // Solapamientos por categoría
    const byCat = {};
    for (const s of active) (byCat[s.cat] = byCat[s.cat] || []).push(s);
    const overlapLimit = { streaming: 2, musica: 1, nube: 1, software: 3 };
    for (const cat in overlapLimit) {
      const list = byCat[cat] || [];
      if (list.length > overlapLimit[cat]) {
        const sorted = [...list].sort((a, b) => b.monthly - a.monthly);
        const saving = round2(sorted.slice(overlapLimit[cat]).reduce((a, s) => a + s.monthly, 0));
        leaks.push({ type: 'solape', sev: 2, key: 'cat-' + cat, merchant: CATS[cat].label,
          title: `${list.length} servicios de ${CATS[cat].label.toLowerCase()} a la vez`,
          detail: `${list.map(s => s.merchant).join(', ')}. Rotarlos (uno cada vez) te ahorraría unos ${fmt(saving)}/mes.`, saving });
      }
    }
    // Gasto hormiga (pedidos/trayectos frecuentes)
    const since = new Date(now - 90 * DAY);
    const recentOne = oneoffs.filter(c => c.date >= since);
    const byMerchant = {};
    for (const c of recentOne) (byMerchant[c.key] = byMerchant[c.key] || []).push(c);
    for (const k in byMerchant) {
      const l = byMerchant[k];
      const perMonth = round2(l.reduce((a, c) => a + c.amount, 0) / 3);
      if (l.length >= 6 && perMonth >= 30 && ['comida', 'transporte', 'compras', 'otros'].includes(l[0].cat)) {
        leaks.push({ type: 'hormiga', sev: l[0].cat === 'compras' ? 1 : 2, key: k, merchant: l[0].merchant,
          title: `Gasto hormiga en ${l[0].merchant}`,
          detail: `${Math.round(l.length / 3)} cargos al mes de media, unos ${fmt(perMonth)}/mes. Reducirlo a la mitad son ${fmt(perMonth * 6)} al año.`,
          saving: round2(perMonth / 2) });
      }
    }
    // Pequeñas que suman
    const small = active.filter(s => s.monthly < 5);
    if (small.length >= 3) leaks.push({ type: 'pequenas', sev: 1, key: 'small', merchant: 'Varias',
      title: `${small.length} suscripciones pequeñas que suman`,
      detail: `${small.map(s => s.merchant).join(', ')}: ${fmt(small.reduce((a, s) => a + s.monthly, 0))}/mes que pasan desapercibidos.`, saving: 0 });

    leaks.sort((a, b) => b.sev - a.sev || (b.saving || 0) - (a.saving || 0));
    // Ahorro potencial (sin contar dos veces el mismo servicio)
    const counted = new Set();
    let potential = 0;
    for (const l of leaks) { if (!l.saving || counted.has(l.key)) continue; counted.add(l.key); potential += l.saving; }
    potential = round2(Math.min(potential, monthlyRec + oneoffMonthly(oneoffs, now)));

    // 4. Tendencia mensual (6 meses)
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ y: d.getFullYear(), m: d.getMonth(), partial: i === 0, label: d.toLocaleDateString('es-ES', { month: 'short' }).replace('.', ''), rec: 0, one: 0 });
    }
    const allCharges = [...subs.flatMap(s => s.history), ...oneoffs];
    for (const c of allCharges) {
      const mo = months.find(x => x.y === c.date.getFullYear() && x.m === c.date.getMonth());
      if (!mo) continue;
      if (oneoffs.includes(c)) mo.one += c.amount; else mo.rec += c.amount;
    }
    months.forEach(m => { m.rec = round2(m.rec); m.one = round2(m.one); m.total = round2(m.rec + m.one); });

    // 5. Por categoría (mensual: recurrente + media de puntuales de 3 meses)
    const catTotals = {};
    for (const s of active) catTotals[s.cat] = (catTotals[s.cat] || 0) + s.monthly;
    for (const c of recentOne) catTotals[c.cat] = (catTotals[c.cat] || 0) + c.amount / 3;
    const categories = Object.entries(catTotals).map(([k, v]) => ({ key: k, label: CATS[k].label, color: CATS[k].color, value: round2(v) }))
      .sort((a, b) => b.value - a.value);

    const oneMonthly = oneoffMonthly(oneoffs, now);
    const monthlyAll = round2(monthlyRec + oneMonthly);
    const score = Math.max(5, Math.min(99, Math.round(100 - (monthlyAll ? potential / monthlyAll * 160 : 0) - leaks.filter(l => l.sev >= 2).length * 2)));

    const upcoming = active.filter(s => (s.next - now) / DAY <= 31).sort((a, b) => a.next - b.next);

    return {
      charges, subs: subs.sort((a, b) => b.monthly - a.monthly), active, oneoffs, leaks, months, categories, upcoming,
      totals: { monthlyRec, yearlyRec: round2(monthlyRec * 12), oneMonthly, monthlyAll, potential, yearlyPotential: round2(potential * 12), score,
        emails: emails.length, found: charges.length },
      tips: buildTips(active, categories, leaks)
    };
  }

  function oneoffMonthly(oneoffs, now) {
    const since = new Date(now - 90 * DAY);
    return round2(oneoffs.filter(c => c.date >= since).reduce((a, c) => a + c.amount, 0) / 3);
  }

  function buildTips(active, categories, leaks) {
    const tips = [];
    const has = cat => active.some(s => s.cat === cat);
    if (active.some(s => s.cycle === 'monthly' && ['software', 'formacion', 'nube'].includes(s.cat)))
      tips.push({ t: 'Pasa a anual lo que usas todo el año', d: 'Las herramientas que usas cada mes suelen costar un 15–20 % menos en pago anual.' });
    if (has('streaming')) tips.push({ t: 'Rota tus plataformas de vídeo', d: 'Mantén solo una activa y cambia cada mes según lo que quieras ver.' });
    if (active.some(s => ['spotify', 'youtube', 'netflix', 'icloud', 'google-one'].includes(s.svc)))
      tips.push({ t: 'Comparte un plan familiar', d: 'Spotify, YouTube, iCloud o Google One cuestan mucho menos repartidos entre 4–6 personas.' });
    if (has('telecom') || has('hogar')) tips.push({ t: 'Revisa luz, fibra y móvil una vez al año', d: 'Son los gastos fijos más grandes y los que más bajan al comparar o llamar para negociar.' });
    if (categories.some(c => c.key === 'comida' && c.value > 40)) tips.push({ t: 'Pon un tope semanal a los pedidos a domicilio', d: 'Los gastos de envío y servicio suelen añadir un 25–30 % al precio de la comida.' });
    tips.push({ t: 'Usa una tarjeta solo para suscripciones', d: 'Una tarjeta virtual o prepago con saldo limitado evita cobros sorpresa y renovaciones olvidadas.' });
    tips.push({ t: 'Calendario antes que fuerza de voluntad', d: 'Activa los avisos 3 días antes de cada cobro y decide con calma si renovar.' });
    return tips.slice(0, 6);
  }

  const round2 = n => Math.round(n * 100) / 100;
  const fmt = n => (n || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
  const fmtDate = d => new Date(d).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });

  /* ---------- Lectura de .eml / .mbox / texto pegado ---------- */
  function decodeQP(s) {
    return s.replace(/=\r?\n/g, '').replace(/(=[0-9A-F]{2})+/gi, m => {
      try { return decodeURIComponent(m.replace(/=/g, '%')); } catch { return m.replace(/=([0-9A-F]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16))); }
    });
  }
  function decodeB64(s) {
    try { const bin = atob(s.replace(/\s/g, '')); const bytes = Uint8Array.from(bin, c => c.charCodeAt(0)); return new TextDecoder('utf-8').decode(bytes); } catch { return ''; }
  }
  function decodeHeader(v) {
    return (v || '').replace(/=\?([^?]+)\?([BQ])\?([^?]*)\?=/gi, (_, cs, enc, txt) =>
      enc.toUpperCase() === 'B' ? decodeB64(txt) : decodeQP(txt.replace(/_/g, ' '))).replace(/\s+/g, ' ').trim();
  }
  function htmlToText(h) {
    return h.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi, ' ').replace(/<br\s*\/?>|<\/p>|<\/tr>|<\/div>/gi, '\n')
      .replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&euro;/g, '€').replace(/&amp;/g, '&').replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n)).replace(/[ \t]+/g, ' ');
  }
  function parseHeaders(block) {
    const h = {};
    block.replace(/\r?\n[ \t]+/g, ' ').split(/\r?\n/).forEach(line => {
      const i = line.indexOf(':'); if (i > 0) h[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).trim();
    });
    return h;
  }
  function decodePart(headers, body) {
    const te = (headers['content-transfer-encoding'] || '').toLowerCase();
    let out = te === 'base64' ? decodeB64(body) : te === 'quoted-printable' ? decodeQP(body) : body;
    if (/text\/html/i.test(headers['content-type'] || '')) out = htmlToText(out);
    return out;
  }
  function extractBody(headers, body, depth = 0) {
    const ct = headers['content-type'] || 'text/plain';
    const bm = ct.match(/boundary="?([^";]+)"?/i);
    if (/multipart/i.test(ct) && bm && depth < 5) {
      const parts = body.split('--' + bm[1]).slice(1);
      let plain = '', html = '';
      for (const p of parts) {
        if (p.startsWith('--')) break;
        const sep = p.search(/\r?\n\r?\n/);
        if (sep < 0) continue;
        const ph = parseHeaders(p.slice(0, sep)); const pb = p.slice(sep).replace(/^\r?\n\r?\n/, '');
        const pct = ph['content-type'] || 'text/plain';
        if (/multipart/i.test(pct)) { const t = extractBody(ph, pb, depth + 1); if (t) plain = plain || t; }
        else if (/text\/plain/i.test(pct)) plain += decodePart(ph, pb);

    return decodePart(headers, body);

  function parseEml(raw, source = 'archivo') {
    const sep = raw.search(/\r?\n\r?\n/);
    if (sep < 0) return null;
    const h = parseHeaders(raw.slice(0, sep));
    const body = extractBody(h, raw.slice(sep).replace(/^\r?\n\r?\n/, ''));
    if (!h.date && !h.subject) return null;
    return { id: h['message-id'] || null, from: decodeHeader(h.from), subject: decodeHeader(h.subject), date: h.date ? new Date(h.date).toISOString() : new Date().toISOString(), body, source };
  }
  function parseMbox(raw, source = 'archivo') {

  /** Texto pegado: bloques separados por línea "---" o por cabeceras "De:/From:" */
  function parsePasted(txt, source = 'pegado') {
    const blocks = txt.split(/\n-{3,}\n|\n(?=(?:De|From):\s)/i).map(b => b.trim()).filter(Boolean);
    const out = [];
    for (const b of blocks) {
      const from = (b.match(/^(?:De|From):\s*(.+)$/mi) || [])[1] || '';
      const subject = (b.match(/^(?:Asunto|Subject):\s*(.+)$/mi) || [])[1] || b.split('\n')[0].slice(0, 120);
      const dateS = (b.match(/^(?:Fecha|Date):\s*(.+)$/mi) || [])[1];
      let date = dateS ? parseLooseDate(dateS) : null;
      if (!date) { const dm = b.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if (dm) date = new Date(+(dm[3].length === 2 ? '20' + dm[3] : dm[3]), +dm[2] - 1, +dm[1]); }

    }
    return out;
  }
  function parseLooseDate(s) {
    // Formato europeo primero (dd/mm/aaaa)
    const m = s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
    if (m) return new Date(+(m[3].length === 2 ? '20' + m[3] : m[3]), +m[2] - 1, +m[1], 12);
    const d = new Date(s); if (!isNaN(d)) return d;

    const m2 = s.toLowerCase().match(/(\d{1,2}) de (\w{3})\w* de (\d{4})/);
    if (m2 && meses.indexOf(m2[2]) > -1) return new Date(+m2[3], meses.indexOf(m2[2]), +m2[1]);
    return null;
  }

<script>

const CFG = Object.assign({
  googleClientId: '',          // ID de cliente OAuth de Google (Gmail, solo lectura)
  supabaseUrl: '', supabaseAnonKey: '',  // Opcional: cuentas en la nube con Supabase Auth
  stripe: { pro: '', proYear: '', business: '', businessYear: '', portal: '' }, // Payment Links de Stripe + portal de cliente
  gmailMaxMessages: 400
}, window.HF_CONFIG || {});

const E = window.HFEngine;
const $ = (s, el = document) => el.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Almacenamiento seguro (con respaldo en memoria) ---------- */
const Store = (() => {
  const mem = {};
  let ls = null;
  try { ls = window.localStorage; ls.setItem('__hf', '1'); ls.removeItem('__hf'); } catch { ls = null; }
  return {
    get(k, d = null) { try { const v = ls ? ls.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { const s = JSON.stringify(v); try { ls ? ls.setItem(k, s) : (mem[k] = s); } catch (e) { mem[k] = s; console.warn('Almacenamiento lleno', e); } },
    del(k) { try { ls ? ls.removeItem(k) : delete mem[k]; } catch { delete mem[k]; } },
    persistent: !!ls
  };
})();

/* ---------- Cuentas ---------- */
const PLANS = {
  free:     { id: 'free', name: 'Gratis', mailboxes: 1, history: 12, alerts: false, export: false },
  pro:      { id: 'pro', name: 'Pro', mailboxes: 5, history: 24, alerts: true, export: true },
  business: { id: 'business', name: 'Empresas', mailboxes: 25, history: 36, alerts: true, export: true }
};

async function hashPass(pass, salt) {
  if (window.crypto && crypto.subtle) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256);

}
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

let supa = null;
async function getSupabase() {
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) return null;

  await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js');

}
function loadScript(src) {
  return new Promise((res, rej) => {

    s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(s);
  });
}
const cloud = () => !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const ERR_ES = m => /invalid login/i.test(m) ? 'Correo o contraseña incorrectos.' : /not confirmed/i.test(m) ? 'Aún no has confirmado tu correo. Revisa tu bandeja de entrada (y spam).'
  : /already registered|already exists/i.test(m) ? 'Ya existe una cuenta con ese correo. Entra con tu contraseña.' : /rate limit|security purposes/i.test(m) ? 'Demasiados intentos. Espera un minuto y vuelve a probar.'
  : /password/i.test(m) && /least|short|weak/i.test(m) ? 'La contraseña es demasiado débil (mínimo 8 caracteres).' : m;
const siteBase = () => location.origin + location.pathname;

const Auth = {
  user: null, recovery: false,
  /** Restaura la sesión al abrir la web */
  async init() {

    else if (/access_token=|type=signup|type=magiclink/.test(location.hash)) history.replaceState(null, '', this.user ? '#app-correos' : '#entrar');
  },
  async fromSession(session) {
    const sb = await getSupabase();
    const u = session.user;
    const { data: p } = await sb.from('profiles').select('name,plan,plan_status,plan_period_end,stripe_customer_id').eq('id', u.id).maybeSingle();
    this.user = { id: u.id, email: u.email, name: (p && p.name) || u.user_metadata?.name || u.email.split('@')[0], plan: (p && p.plan) || 'free',

  },
  async refreshProfile() { const sb = await getSupabase(); if (!sb || !this.user?.cloud) return; const { data } = await sb.auth.getSession(); if (data.session) { const st = Data.state; await this.fromSession(data.session); Data.state = Data.state || st; } },
  load() {
    const email = Store.get('hf:session');

  },
  async register(name, email, pass) {

    Store.set('hf:users', users); Store.set('hf:session', email);

  },
  async login(email, pass) {
    email = email.trim().toLowerCase();
    const sb = await getSupabase();
    if (sb) {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw new Error(ERR_ES(error.message));
      return this.fromSession(data.session);
    }

    const u = users[email];
    if (!u || (await hashPass(pass, u.salt)) !== u.hash) throw new Error('Correo o contraseña incorrectos.');

  },
  async resetPassword(email) {
    const sb = await getSupabase(); if (!sb) throw new Error('No disponible en modo local.');
    const { error } = await sb.auth.resetPasswordForEmail(email.trim().toLowerCase(), { redirectTo: siteBase() + '#app-ajustes' });

  async setPassword(pass) {

  },

  exitDemo() { this.user = this.prev || null; this.prev = null; },
  logout() {

  },
  plan() { return PLANS[(this.user && this.user.plan) || 'free'] || PLANS.free; }
};

/* ---------- Datos del usuario ---------- */
const emptyState = () => ({ sources: [], emails: [], prefs: { usage: {}, cancelled: {}, ignored: {}, alertDays: 3 } });
/** Solo se guarda el fragmento del recibo alrededor del importe, nunca el correo entero */
function receiptSnippet(text) {
  text = String(text || '').replace(/\s+/g, ' ');
  if (text.length <= 700) return text;
  const m = text.search(/(total|importe|amount|cargo|charged|pagad|paid)[^€$£]{0,40}(€|EUR|\$|£|\d)/i);
  const i = m > -1 ? m : Math.max(0, text.search(/\d+[.,]\d{2}\s?(€|EUR)|(€|\$|£)\s?\d/i));
  const hint = (text.match(/[^.]{0,80}(suscripci[oó]n|subscription|mensual|monthly|anual|annual|yearly|renovaci[oó]n|renewal|prueba gratuita|free trial)[^.]{0,80}/i) || [''])[0];
  return (hint + ' … ' + text.slice(Math.max(0, i - 200), i + 300)).trim();
}
const Data = {
  state: null, analysis: null, demoState: null, _t: null,
  key() { return this.user().cloud ? 'hf:cache:' + this.user().id : 'hf:data:' + this.user().email; },
  user() { return Auth.user; },
  async pull() {
    const sb = await getSupabase(); const u = Auth.user;
    const cached = Store.get('hf:cache:' + u.id);
    const { data, error } = await sb.from('user_data').select('state,updated_at').eq('user_id', u.id).maybeSingle();
    if (error) { console.warn(error); this.state = cached || emptyState(); return; }

    this.owner = u.id;
    Store.set('hf:cache:' + u.id, this.state);
  },
  load() {
    const owner = Auth.user.demo ? 'demo' : (Auth.user.id || Auth.user.email);
    if (this.owner !== owner) { this.state = null; this.owner = owner; }
    if (Auth.user.demo) {
      if (!this.demoState) this.demoState = { sources: [{ id: 'demo', type: 'demo', label: 'Bandeja de ejemplo', account: 'demo@horahflow.com', added: Date.now(), count: 0 }], emails: E.demoInbox(), prefs: { usage: {}, cancelled: {}, ignored: {}, alertDays: 3 } };
      this.state = this.demoState;
    } else if (!this.state) this.state = Store.get(this.key(), emptyState());
    this.state.prefs = Object.assign({ usage: {}, cancelled: {}, ignored: {}, alertDays: 3 }, this.state.prefs);
    this.recompute(); return this.state;
  },
  save() {
    if (!Auth.user.demo) {
      Store.set(this.key(), this.state);
      if (Auth.user.cloud) { clearTimeout(this._t); this._t = setTimeout(() => this.push(), 600); }
    }
    this.recompute();
  },
  async push() {
    const sb = await getSupabase(); if (!sb || !Auth.user?.cloud) return;
    const { error } = await sb.from('user_data').upsert({ user_id: Auth.user.id, state: this.state }, { onConflict: 'user_id' });
    if (error) { console.warn(error); toast('No se pudo sincronizar. Lo reintentaremos.'); setTimeout(() => this.push(), 8000); }
  },
  recompute() {

    const emails = this.state.emails.filter(e => new Date(e.date) >= cutoff);
    this.analysis = E.analyze(emails, this.state.prefs);

  addEmails(source, emails) {
    const existing = this.state.sources.find(s => s.type === source.type && s.account && s.account === source.account);

    if (!existing) this.state.sources.push(src);
    src.updated = Date.now();

    let added = 0;
    for (const e of emails) {
      const m = { id: e.id, from: e.from, subject: e.subject, date: e.date, body: receiptSnippet(e.body), source: src.type, sourceId: src.id, account: source.account || '' };
      const k = (m.id || '') + '|' + m.subject + '|' + m.date;
      if (seen.has(k)) continue; seen.add(k);

      if (!E.toCharge(Object.assign({}, m, { body: e.body }))) continue;

    }
    this.save(); return added;
  },
  removeSource(id) {
    const s = this.state.sources.find(x => x.id === id);
    this.state.sources = this.state.sources.filter(x => x.id !== id);
    this.state.emails = this.state.emails.filter(e => e.sourceId !== id && !(s && s.type === 'demo' && e.source === 'demo'));
    this.save();
  },
  mailboxCount() { return new Set(this.state.sources.filter(s => s.type === 'gmail').map(s => s.account)).size; },
  wipe() { this.state = emptyState(); this.save(); }
};

function newPasswordModal() {

    <input class="input" type="password" id="np" autocomplete="new-password"><div class="err" id="np-e" style="margin-top:8px"></div>

/* ---------- Gmail (OAuth en el navegador, solo lectura) ---------- */
const Gmail = {
  query: 'newer_than:2y (recibo OR factura OR receipt OR invoice OR "tu pedido" OR "your order" OR suscripción OR subscription OR renovación OR renewal OR "pago" OR payment OR cargo OR membresía OR membership OR cuota) -category:promotions',
  async connect(onProgress) {
    if (!CFG.googleClientId) throw Object.assign(new Error('NO_CLIENT_ID'), { code: 'NO_CLIENT_ID' });
    await loadScript('https://accounts.google.com/gsi/client');
    const token = await new Promise((resolve, reject) => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: CFG.googleClientId,
        scope: 'https://www.googleapis.com/auth/gmail.readonly',
        callback: r => r.error ? reject(new Error(r.error)) : resolve(r.access_token),
        error_callback: e => reject(new Error(e.type === 'popup_closed' ? 'Has cerrado la ventana de Google.' : 'Google no ha permitido el acceso.'))

      const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path, { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) throw new Error('Gmail respondió ' + r.status);
      return r.json();
    };
    const profile = await api('profile');
    onProgress && onProgress(0, 0, 'Buscando recibos y facturas…');
    let ids = [], pageToken = '';
    do {
      const r = await api(`messages?maxResults=100&q=${encodeURIComponent(this.query)}${pageToken ? '&pageToken=' + pageToken : ''}`);
      ids.push(...(r.messages || []).map(m => m.id)); pageToken = r.nextPageToken;
    } while (pageToken && ids.length < CFG.gmailMaxMessages);
    ids = ids.slice(0, CFG.gmailMaxMessages);
    const out = []; let done = 0;
    const worker = async () => {
      while (ids.length) {
        const id = ids.shift();
        try { const m = await api(`messages/${id}?format=full`); out.push(this.toEmail(m, profile.emailAddress)); } catch (e) { console.warn(e); }
        onProgress && onProgress(++done, done + ids.length, 'Leyendo correos…');
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    try { google.accounts.oauth2.revoke(token, () => {}); } catch {}
    return { account: profile.emailAddress, emails: out };
  },
  toEmail(m, account) {
    const hdr = n => ((m.payload.headers || []).find(h => h.name.toLowerCase() === n) || {}).value || '';
    const dec = d => { try { const b = atob(d.replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))); } catch { return ''; } };
    let plain = '', html = '';
    const walk = p => {
      if (!p) return;
      if (p.mimeType === 'text/plain' && p.body && p.body.data) plain += dec(p.body.data);
      else if (p.mimeType === 'text/html' && p.body && p.body.data) html += dec(p.body.data);
      (p.parts || []).forEach(walk);
    };
    walk(m.payload);
    const body = plain.trim().length > 30 ? plain : (html ? E.htmlToText(html) : m.snippet || '');
    return { id: m.id, from: hdr('from'), subject: hdr('subject'), date: new Date(+m.internalDate).toISOString(), body, source: 'gmail', account };
  }
};

/* ---------- Archivos ---------- */
async function readFiles(files) {
  const out = [];
  for (const f of files) {
    const txt = await f.text();
    if (/\.mbox$/i.test(f.name) || /^From \S+/.test(txt)) out.push(...E.parseMbox(txt, 'archivo'));
    else if (/\.eml$/i.test(f.name) || /^(Received|Return-Path|From|Delivered-To|MIME-Version|Date):/im.test(txt.slice(0, 2000))) { const e = E.parseEml(txt, 'archivo'); if (e) out.push(e); }
    else out.push(...E.parsePasted(txt, 'archivo'));
  }
  return out;
}

function modal(html, onMount) {

  bg.innerHTML = `<div class="modal fade-in" role="dialog" aria-modal="true"><button class="x" data-close aria-label="Cerrar">${I.x}</button>${html}</div>`;

}

  if (navigator.clipboard) return navigator.clipboard.writeText(text).then(() => toast('Copiado al portapapeles')).catch(() => fallbackCopy(text));
  fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Copiado al portapapeles'); } catch { toast('No se pudo copiar'); } ta.remove();
}
function download(name, text, type = 'text/csv') {
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();

}

const svg = (p, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {

function bindDemo() {

  const show = inbox.slice(0, 40);
  $('#demo-count').textContent = `${inbox.length} correos`;
  $('#demo-inbox').innerHTML = show.map((m, i) => {
    const name = m.from.split('<')[0].trim();
    return `<div class="mail" data-i="${i}"><span class="av">${esc(name.charAt(0))}</span><div class="meta"><div class="from"><span>${esc(name)}</span><small>${fmtDate(m.date)}</small></div><div class="subj">${esc(m.subject)}</div></div></div>`;
  }).join('');
  $('#demo-run').onclick = async () => {
    $('#demo-run').classList.add('hidden'); const prog = $('#demo-prog'); prog.classList.remove('hidden');
    const rows = $$('#demo-inbox .mail'); const list = $('#demo-inbox');
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i]; r.classList.add('scan');
      list.scrollTop = Math.max(0, r.offsetTop - list.offsetTop - 120);
      await new Promise(res => setTimeout(res, 45));
      r.classList.remove('scan'); r.classList.add(E.toCharge(show[i]) ? 'hit' : 'skip');

function leakHTML(l) {
  const c = l.sev >= 3 ? 'red' : l.sev === 2 ? 'amber' : 'gray';
  const ic = { duplicado: I.alert, subida: I.up, prueba: I.clock, solape: I.list, hormiga: I.receipt, renovacion: I.cal, sinuso: I.x, pequenas: I.repeat }[l.type] || I.alert;
  const save = l.saving ? `${fmt(l.saving)}/mes` : l.oneTime ? `${fmt(l.oneTime)}` : '';
  return `<div class="leak"><span class="dot ${c}">${ic}</span><div class="txt"><b>${esc(l.title)}</b><p>${esc(l.detail)}</p></div>${save ? `<span class="save num">${save}</span>` : ''}</div>`;
}

    'app': overviewHTML, 'app-suscripciones': subsHTML, 'app-calendario': calendarHTML, 'app-ahorro': savingsHTML,
    'app-gastos': txHTML, 'app-correos': sourcesHTML, 'app-ajustes': settingsHTML
  }[view] || overviewHTML)(a);
  root.innerHTML = appShell(view, html);
  $('#logout').onclick = () => { Auth.logout(); location.hash = 'inicio'; };
  bindAppView(view);
  window.scrollTo(0, 0);
}

/* ---------- Resumen ---------- */

    <div class="card kpi"><div class="l">Al año en recurrentes</div><div class="v num">${fmt0(t.yearlyRec)}</div><div class="s">si no cambias nada</div></div>
    <div class="card kpi"><div class="l">Gasto variable / mes</div><div class="v num">${fmt(t.oneMonthly)}</div><div class="s">media últimos 3 meses</div></div>
    <div class="card kpi hl"><div class="l">Puedes ahorrar</div><div class="v num">${fmt0(t.yearlyPotential)}</div><div class="s">al año · ${fmt(t.potential)}/mes</div></div>
  </div>
  <div class="grid-2">

      ${a.leaks.length > 6 ? `<a href="#app-ahorro" class="link" style="display:inline-block;margin-top:14px;font-size:14px">Ver las ${a.leaks.length}</a>` : ''}
    </div>
    <div style="display:grid;gap:16px;align-content:start">
      <div class="card"><h3>Salud de tus gastos</h3><div class="score">${ringHTML(t.score)}<div><b style="font-size:15px">${scoreTxt}</b><p class="hint" style="font-size:14px;margin-top:6px">La nota baja con cada fuga y con lo que podrías ahorrar respecto a lo que gastas.</p></div></div></div>
      <div class="card"><h3><span style="display:flex;gap:8px;align-items:center">${I.spark} Pregúntale a Flow</span><small>tu asistente</small></h3>
        <form class="ask" id="ask"><input class="input" id="ask-q" placeholder="¿Cuánto gasto en streaming?" autocomplete="off"><button class="btn btn-dark btn-sm" style="height:46px">Preguntar</button></form>
        <div class="chat" id="chat">${chatLog.map(m => `<div class="msg ${m.r}">${m.t}</div>`).join('')}</div>
        <div class="suggest">${['¿Qué me cobran esta semana?', '¿Cuál es la más cara?', '¿Dónde puedo ahorrar?', '¿Cuánto gasto al año?'].map(s => `<button type="button" data-q="${s}">${s}</button>`).join('')}</div>
      </div>

  <div class="grid-2b">

      ${a.categories.map(c => `<div class="barrow"><span class="name"><i style="background:${c.color}"></i>${c.label}</span><span class="track"><b style="width:${c.value / cmax * 100}%;background:${c.color}"></b></span><span class="amt num">${fmt(c.value)}</span></div>`).join('')}
    </div></div>
    <div class="card"><h3>Últimos 6 meses <span class="legend"><span><i style="background:var(--ink-2)"></i>Recurrente</span><span><i style="background:#8FD6A3"></i>Variable</span></span></h3>
      <div class="trend">${a.months.map(m => `<div class="col ${m.partial ? 'partial' : ''}" title="${m.label}: ${fmt(m.total)}"><span class="tt num">${fmt0(m.total)}</span>
        <div class="stack" style="height:${Math.max(4, m.total / hi * 130)}px"><div class="o" style="flex:${m.one}"></div><div class="r" style="flex:${m.rec}"></div></div>
        <span class="lab">${m.label}${m.partial ? '*' : ''}</span></div>`).join('')}</div>
      <p class="hint" style="font-size:12px;margin-top:8px">* Mes en curso</p>
    </div>
  </div>
  <div class="card"><h3>Próximos cobros <small>${fmt(a.upcoming.reduce((s, x) => s + x.amount, 0))} en 30 días</small></h3>
    ${a.upcoming.length ? `<table class="table"><tbody>${a.upcoming.slice(0, 8).map(s => upcomingRow(s)).join('')}</tbody></table>` : '<p class="hint">No hay cobros previstos en los próximos 30 días.</p>'}

function upcomingRow(s) {
  const days = Math.ceil((s.next - new Date()) / 864e5);
  const when = days <= 0 ? 'Hoy' : days === 1 ? 'Mañana' : `En ${days} días`;
  return `<tr class="clickable" data-sub="${esc(s.key)}"><td><div class="svc">${logoSq(s.merchant)}<div>${esc(s.merchant)}<small>${E.CATS[s.cat].label}</small></div></div></td>
    <td class="hide-m">${fmtDate(s.next)}</td><td><span class="chip ${days <= Data.state.prefs.alertDays ? 'amber' : ''}">${when}</span></td><td class="right"><b class="num">${fmt(s.amount)}</b></td></tr>`;
}
function ringHTML(score) {
  const r = 52, c = 2 * Math.PI * r, col = score >= 75 ? '#2F8F5B' : score >= 50 ? '#B7791F' : '#C2412D';
  return `<div class="ring"><svg width="120" height="120"><circle cx="60" cy="60" r="${r}" stroke="#F1F0F5" stroke-width="12" fill="none"/>
    <circle cx="60" cy="60" r="${r}" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - score / 100)}"/></svg>
    <div class="val num">${score}<small>de 100</small></div></div>`;
}

/* ---------- Flow: asistente ---------- */
function flowAnswer(q) {
  const a = Data.analysis, t = a.totals, s = q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const list = arr => arr.map(x => `<b>${esc(x.merchant)}</b> ${fmt(x.amount)}`).join(', ');
  const now = new Date();
  // ¿Pregunta por un servicio concreto?
  const sub = a.subs.find(x => s.includes(x.merchant.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(' ')[0]));
  if (sub) return `Pagas <b>${esc(sub.merchant)}</b>: ${fmt(sub.amount)} (${E.CYCLE[sub.cycle].label.toLowerCase()}), unos ${fmt(sub.monthly * 12)} al año. Te lo han cobrado ${sub.count} ${sub.count === 1 ? 'vez' : 'veces'} desde ${fmtDate(sub.first)} (${fmt(sub.totalPaid)} en total). Próximo cobro: ${fmtDate(sub.next)}.${sub.priceUp ? ` Ojo: ha subido de ${fmt(sub.priceUp.from)} a ${fmt(sub.priceUp.to)}.` : ''}`;
  const cat = Object.entries(E.CATS).find(([k, c]) => s.includes(k) || c.label.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[ ,]/).some(w => w.length > 3 && s.includes(w)));
  if (cat && /gast|pag|cuanto|cuesta/.test(s)) {
    const c = a.categories.find(x => x.key === cat[0]); const items = a.active.filter(x => x.cat === cat[0]);
    return c ? `En ${cat[1].label.toLowerCase()} gastas unos <b>${fmt(c.value)}/mes</b>${items.length ? ': ' + list(items) : ''}.` : `No he encontrado gastos en ${cat[1].label.toLowerCase()}.`;
  }
  if (/semana|manana|hoy|proxim|cobran|cobra|viene/.test(s)) {
    const lim = /semana/.test(s) ? 7 : /manana/.test(s) ? 1.5 : /hoy/.test(s) ? 1 : 30;
    const up = a.upcoming.filter(x => (x.next - now) / 864e5 <= lim);
    return up.length ? `En ${lim <= 1.5 ? (lim === 1 ? 'el día de hoy' : 'mañana') : lim === 7 ? 'los próximos 7 días' : 'los próximos 30 días'} te cobrarán <b>${fmt(up.reduce((x, y) => x + y.amount, 0))}</b>: ${up.map(x => `${esc(x.merchant)} (${fmtDate(x.next)}, ${fmt(x.amount)})`).join(', ')}.` : 'No tienes cobros previstos en ese periodo.';
  }
  if (/cara|caro|mayor|mas gast/.test(s)) { const top = [...a.active].sort((x, y) => y.monthly - x.monthly).slice(0, 3); return `Tus suscripciones más caras al mes: ${top.map(x => `<b>${esc(x.merchant)}</b> ${fmt(x.monthly)}/mes`).join(', ')}.`; }
  if (/ahorr|recort|reduc|fuga|brecha/.test(s)) { const l = a.leaks.filter(x => x.saving).slice(0, 3); return l.length ? `Puedes ahorrar unos <b>${fmt0(t.yearlyPotential)} al año</b>. Lo primero: ${l.map(x => `${esc(x.title.toLowerCase())} (${fmt(x.saving)}/mes)`).join('; ')}.` : 'No veo ahorros claros ahora mismo. Marca en Suscripciones las que no usas y lo recalculo.'; }
  if (/ano|anual|year/.test(s)) return `Al año pagas <b>${fmt0(t.yearlyRec)}</b> en suscripciones y unos <b>${fmt0(t.oneMonthly * 12)}</b> en gasto variable. En total, <b>${fmt0(t.monthlyAll * 12)}</b>.`;
  if (/mes|mensual|total|cuanto/.test(s)) return `Cada mes pagas <b>${fmt(t.monthlyRec)}</b> en ${a.active.length} suscripciones y unos <b>${fmt(t.oneMonthly)}</b> en compras y pedidos. Total: <b>${fmt(t.monthlyAll)}</b>.`;
  if (/cuantas|numero|suscripciones/.test(s)) return `Tienes <b>${a.active.length} suscripciones activas</b>: ${a.active.map(x => esc(x.merchant)).join(', ')}.`;
  if (/hola|buenas/.test(s)) return '¡Hola! Pregúntame cuánto gastas, qué te cobran esta semana o dónde puedes ahorrar.';
  return 'Aún no sé responder a eso. Prueba con «¿cuánto gasto en música?», «¿qué me cobran esta semana?» o pregúntame por un servicio, como «¿cuánto pago de Netflix?».';
}

/* ---------- Suscripciones ---------- */

function altHTML(x) {
